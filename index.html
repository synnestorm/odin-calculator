<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Cantarell:ital,wght@0,400;0,700;1,400;1,700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <title>Calculator</title>
</head>

<body>
    <header>
        <h1>Calculator</h1>
    </header>
    <main>
        <div class="calc-container">
            <div class="calc-display"></div>
            <div class="calc-buttons">
                <button class="number nine">9</button>
                <button class="number eight">8</button>
                <button class="number seven">7</button>
                <button class="number six">6</button>
                <button class="number five">5</button>
                <button class="number four">4</button>
                <button class="number three">3</button>
                <button class="number two">2</button>
                <button class="number one">1</button>
                <button class="number zero">0</button>
                <button class="operator plus">+</button>
                <button class="operator minus">-</button>
                <button class="operator multiply">*</button>
                <button class="operator divide">/</button>
                <button class="operator equal">=</button>
                <button class="number ac">AC</button>
                <button class="number clear">C</button>
                <button class="number comma">.</button>
                <button class="number prosent">%</button>
                <button class="number symbol">S</button>
            </div>
        </div>
    </main>
    <footer>

    </footer>

    <script src="src/script.js" type="module"></script>
</body>

</html>
